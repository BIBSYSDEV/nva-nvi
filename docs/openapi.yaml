# Follows the NVA team template for OpenAPI documents: docs/openapi.yaml in nva-gradle-template.
#
# The parts marked "Shared" are identical in every NVA service. Change them in the template first,
# then sync the services. The README in nva-gradle-template explains the conventions.
openapi: 3.0.3
info:
  title: NVA Scientific Index API
  description: Public API for scientific index candidates in NVA.
  version: 1.0.1
  # Shared
  contact:
    name: Nasjonalt vitenarkiv (NVA)
    email: kontakt@sikt.no
    url: https://nva.sikt.no
  # Shared
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: https://api.nva.unit.no/scientific-index
    description: Production environment
  - url: https://api.test.nva.aws.unit.no/scientific-index
    description: Test environment
  - url: https://api.dev.nva.aws.unit.no/scientific-index
    description: Development environment
  - url: https://api.sandbox.nva.aws.unit.no/scientific-index
    description: Sandbox environment
  - url: https://api.e2e.nva.aws.unit.no/scientific-index
    description: End-to-end test environment
tags:
  - name: Context
    description: JSON-LD context operations
  - name: Period
    description: NVI reporting period management
  - name: Candidate
    description: NVI candidate operations
  - name: Report
    description: Institution reports and aggregations
  - name: Report (partially implemented)
    description: Report endpoints that are not fully implemented yet

# Shared
x-amazon-apigateway-request-validators:
  validate_body:
    validateRequestBody: true
    validateRequestParameters: false
  validate_parameters:
    validateRequestBody: false
    validateRequestParameters: true
  validate_body_and_parameters:
    validateRequestBody: true
    validateRequestParameters: true

# Shared. These give the errors that API Gateway produces itself the same Problem body, media type
# and CORS header as the errors from the handlers.
x-amazon-apigateway-gateway-responses:
  BAD_REQUEST_BODY:
    statusCode: 400
    responseParameters:
      gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
      gatewayresponse.header.Content-Type: "'application/problem+json'"
    responseTemplates:
      application/json: |-
        {
          "title": "Bad Request",
          "status": 400,
          "detail": "$context.error.message: $context.error.validationErrorString",
          "requestId": "$context.requestId",
          "instance": "$context.path"
        }
  BAD_REQUEST_PARAMETERS:
    statusCode: 400
    responseParameters:
      gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
      gatewayresponse.header.Content-Type: "'application/problem+json'"
    responseTemplates:
      application/json: |-
        {
          "title": "Bad Request",
          "status": 400,
          "detail": $context.error.messageString,
          "requestId": "$context.requestId",
          "instance": "$context.path"
        }
  UNAUTHORIZED:
    statusCode: 401
    responseParameters:
      gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
      gatewayresponse.header.Content-Type: "'application/problem+json'"
    responseTemplates:
      application/json: |-
        {
          "title": "Unauthorized",
          "status": 401,
          "detail": $context.error.messageString,
          "requestId": "$context.requestId",
          "instance": "$context.path"
        }
  ACCESS_DENIED:
    statusCode: 403
    responseParameters:
      gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
      gatewayresponse.header.Content-Type: "'application/problem+json'"
    responseTemplates:
      application/json: |-
        {
          "title": "Forbidden",
          "status": 403,
          "detail": $context.error.messageString,
          "requestId": "$context.requestId",
          "instance": "$context.path"
        }
  MISSING_AUTHENTICATION_TOKEN:
    statusCode: 403
    responseParameters:
      gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
      gatewayresponse.header.Content-Type: "'application/problem+json'"
    responseTemplates:
      application/json: |-
        {
          "title": "Forbidden",
          "status": 403,
          "detail": $context.error.messageString,
          "requestId": "$context.requestId",
          "instance": "$context.path"
        }

# Shared. Set security per operation, never at the root: that broke CORS in nva-nvi (nva-nvi#619,
# reverted in nva-nvi#623).
