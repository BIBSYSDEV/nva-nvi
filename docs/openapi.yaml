paths:
  /context:
    get:
      tags:
        - Context
      summary: Get JSON-LD context
      description: Get JSON-LD context for NVI.
      operationId: getNviContext
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FetchNviCandidateContextHandler.Arn}:live/invocations
        httpMethod: POST
        type: AWS_PROXY
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NviCandidateContext"
            application/ld+json:
              schema:
                $ref: "#/components/schemas/NviCandidateContext"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /period:
    post:
      tags:
        - Period
      summary: Create period
      description: Create NVI period.
      operationId: createNviPeriod
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertNviPeriodRequest"
      security: *authenticated
      x-amazon-apigateway-request-validator: validate_body
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CreateNviPeriodHandler.Arn}:live/invocations
        httpMethod: POST
        type: AWS_PROXY
      responses:
        "201":
          description: "Period created."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NviPeriod"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
    get:
      tags:
        - Period
      summary: List periods
      description: List NVI periods.
      operationId: listNviPeriods
      security: *authenticated
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FetchNviPeriodsHandler.Arn}:live/invocations
        httpMethod: POST
        type: AWS_PROXY
      responses:
        "200":
          description: "Periods fetched."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NviPeriods"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      tags:
        - Period
      summary: Update period
      description: Update NVI period.
      operationId: updateNviPeriod
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertNviPeriodRequest"
      security: *authenticated
      x-amazon-apigateway-request-validator: validate_body
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${UpdateNviPeriodHandler.Arn}:live/invocations
        httpMethod: POST
        type: AWS_PROXY
      responses:
        "200":
          description: "Period updated."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NviPeriod"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /period/{periodIdentifier}:
    get:
      tags:
        - Period
      summary: Get period
      description: Get NVI period.
      operationId: getNviPeriod
      parameters:
        - in: path
          name: periodIdentifier
          description: The identifier of the reporting period.
          required: true
          schema:
            type: string
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FetchNviPeriodHandler.Arn}:live/invocations
        httpMethod: POST
        type: AWS_PROXY
      responses:
        "200":
          description: "Period fetched successfully."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NviPeriod"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"

  /candidate:
    get:
      tags:
        - Candidate
      summary: Search for candidates
      description: Search for NVI candidates.
      operationId: searchNviCandidate
      parameters:
        - in: query
          name: query
          schema:
            type: string
          description: Term to search for in NVI candidates.
        - in: query
          name: affiliations
          description: |
            Filters by affiliation to one of the given organization IDs. By default, this includes 
            candidates where a creator is affiliated with a sub-unit of the organization specified.
          required: false
          explode: false
          schema:
            type: array
            items:
              type: string
          examples:
            single:
              summary: Single affiliation
              value: ["20754.1.0.0"]
            multiple:
              summary: One of multiple affiliations
              value: ["20754.1.0.0", "20754.2.2.0"]
        - in: query
          name: excludeSubUnits
          description: |
            Excludes sub-units when checking affiliations. Must be combined with the `affiliations`
            parameter.
          required: false
          schema:
            type: boolean
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
            minimum: 0
          description: The offset of the search for use in pagination. Must be divisible by the size.
        - in: query
          name: size
          schema:
            type: integer
            default: 10
          description: The size of each page of the search for use in pagination. Default is 10.
        - in: query
          name: status
          description: Filter by approval status for the user's organization that matches one of the given values.
          required: false
          explode: false
          schema:
            type: array
            items:
              type: string
              enum: [new, pending, approved, rejected]
          examples:
            single:
              summary: Single approval status
              value: ["pending"]
            multiple:
              summary: One of multiple statuses
              value: ["pending", "approved"]
        - in: query
          name: globalStatus
          description: Filter by global approval status that matches one of the given values.
          required: false
          explode: false
          schema:
            type: array
            items:
              type: string
              enum: [pending, approved, rejected, dispute]
          examples:
            single:
              summary: Single global status
              value: ["dispute"]
            multiple:
              summary: One of multiple global statuses
              value: ["dispute", "rejected"]
        - in: query
          name: filter
          description: |
            Apply a custom filter:
            * `rejectedByOthers` - Show candidates rejected by other organizations
            * `approvedByOthers` - Show candidates approved by other organizations
            * `collaboration` - Show candidates with multiple NVI organizations involved

            DEPRECATED - These filters are marked for deprecation and will be removed:
            * `pending`
            * `pendingCollaboration`
            * `assigned`
            * `assignedCollaboration`
            * `approved`
            * `approvedCollaboration`
            * `rejected`
            * `rejectedCollaboration`
            * `dispute`
            * `assignments`
          required: false
          schema:
            type: string
            enum:
              - rejectedByOthers
              - approvedByOthers
              - collaboration
              - pending
              - pendingCollaboration
              - assigned
              - assignedCollaboration
              - approved
              - approvedCollaboration
              - rejected
              - rejectedCollaboration
              - dispute
              - assignments
          example: "rejectedByOthers"
        - in: query
          name: year
          schema:
            type: string
            pattern: "^[0-9]{4}$"
          description: Filters by publication year.
        - in: query
          name: category
          schema:
            type: string
          description: No longer in use and will be removed.
          deprecated: true
        - in: query
          name: title
          schema:
            type: string
          description: Filters by publication title.
        - in: query
          name: assignee
          schema:
            type: string
          description: |
            Filters by ID of the assigned curator for an organization. By default, candidates with
            no assigned curator are also included.
            Expected format is `<user_id>@<organization_id>`.
          example: "12345@20754.0.0.0"
        - in: query
          name: excludeUnassigned
          description: Exclude candidates that have no assigned curator.
          required: false
          schema:
            type: boolean
        - in: query
          name: orderBy
          description: Order by field.
          schema:
            type: string
            enum: ["createdDate"]
        - in: query
          name: sortOrder
          description: Order direction.
          schema:
            type: string
            enum: ["asc", "desc"]
      security: *authenticated
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SearchNviCandidatesHandler.Arn}:live/invocations
        httpMethod: POST
        type: AWS_PROXY
      responses:
        "200":
          description: "OK."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidateSearchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /candidate/{candidateIdentifier}:
    get:
      tags:
        - Candidate
      summary: Get candidate
      description: Get NVI candidate.
      operationId: getNviCandidate
      parameters:
        - in: path
          name: candidateIdentifier
          description: The identifier of the candidate.
          required: true
          schema:
            type: string
      security: *authenticated
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FetchNviCandidateHandler.Arn}:live/invocations
        httpMethod: POST
        type: AWS_PROXY
      responses:
        "200":
          description: "OK."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NviCandidateResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /candidate/publication/{identifier}:
    get:
      tags:
        - Candidate
      summary: Get candidate by publication identifier
      description: Get NVI candidate by publication identifier.
      operationId: getNviCandidateByPublicationIdentifier
      parameters:
        - $ref: "#/components/parameters/PublicationIdentifierPathParameter"
      security: *authenticated
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FetchNviCandidateByPublicationIdHandler.Arn}:live/invocations
        httpMethod: POST
        type: AWS_PROXY
      responses:
        "200":
          description: "OK."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NviCandidateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /candidate/{candidateIdentifier}/status:
    put:
      tags:
        - Candidate
      summary: Update Candidate Approval Status
      description: >
        Update the approval status of a candidate on behalf of the user's organization.
        A reason must be provided when the status is set to Rejected.
      operationId: updateNviCandidateApprovalStatus
      parameters:
        - in: path
          name: candidateIdentifier
          description: The identifier of the candidate.
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalStatusRequest"
      security: *authenticated
      x-amazon-apigateway-request-validator: validate_body
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${UpdateNviCandidateStatusHandler.Arn}:live/invocations
        httpMethod: POST
        type: AWS_PROXY
      responses:
        "200":
          description: "Approval status updated."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NviCandidateResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /candidate/{candidateIdentifier}/assignee:
    put:
      tags:
        - Candidate
      summary: Update Candidate Assignee
      description: >
        Set or replace the curator assigned to review the candidate on behalf of the
        user's organization.
      operationId: updateNviCandidateAssignee
      parameters:
        - in: path
          name: candidateIdentifier
          description: The identifier of the candidate.
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssigneeRequest"
      security: *authenticated
      x-amazon-apigateway-request-validator: validate_body
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${UpsertAssigneeHandler.Arn}:live/invocations
        httpMethod: POST
        type: AWS_PROXY
      responses:
        "200":
          description: "Assignee updated."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NviCandidateResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /candidate/{candidateIdentifier}/note:
    post:
      tags:
        - Candidate
      summary: Create note on candidate
      description: >
        Create note on NVI candidate.
        Notes can only be added to candidates that are applicable for NVI reporting.
      operationId: createNviCandidateNotes
      parameters:
        - in: path
          name: candidateIdentifier
          description: The identifier of the candidate.
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNoteRequest"
      security: *authenticated
      x-amazon-apigateway-request-validator: validate_body
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CreateNoteHandler.Arn}:live/invocations
        httpMethod: POST
        type: AWS_PROXY
      responses:
        "200":
          description: "Note added."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NviCandidateResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /candidate/{candidateIdentifier}/note/{noteIdentifier}:
    delete:
      tags:
        - Candidate
      summary: Delete note
      description: Delete note on NVI candidate.
      operationId: deleteNviCandidateNote
      parameters:
        - in: path
          name: candidateIdentifier
          description: The identifier of the candidate.
          required: true
          schema:
            type: string
        - in: path
          name: noteIdentifier
          description: The identifier of the note.
          required: true
          schema:
            type: string
      security: *authenticated
      x-amazon-apigateway-request-validator: validate_body
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${RemoveNoteHandler.Arn}:live/invocations
        httpMethod: POST
        type: AWS_PROXY
      responses:
        "200":
          description: "Note deleted."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NviCandidateResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /institution-report/{year}:
    get:
      tags:
        - Report
      summary: Get requesting users organization approval aggregations for a given year
      description: >
        Get organization approval aggregations for a given year. Available to NVI curators,
        editors, admins and backend clients. The institutionId query parameter selects which
        institution to aggregate; admins and backend clients can specify any institution, while
        other users can only specify their own and are otherwise rejected with 401 Unauthorized.
        Clients without a top level organization must specify it, and are otherwise rejected
        with 400 Bad Request.
      operationId: getNviOrganizationAggregationsByYear
      parameters:
        - in: path
          name: year
          description: The year of the nvi period.
          required: true
          schema:
            type: string
        - in: query
          name: institutionId
          description: Top level Cristin organization identifier (e.g. 185.90.0.0). Other users than admins and backend clients may only specify their own institution.
          required: false
          schema:
            type: string
            pattern: '^\d+\.\d+\.\d+\.\d+$'
      security: *authenticated
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FetchInstitutionStatusAggregationHandler.Arn}:live/invocations
        httpMethod: POST
        type: AWS_PROXY
      responses:
        "200":
          description: "OK."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NviInstitutionReportResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /institution-approval-report/{year}:
    get:
      tags:
        - Report
      summary: Get NVI institution report with points per contributor for a given year
      description: >
        Get NVI report for a given year. Available to NVI curators, editors, admins and backend
        clients. The institutionId query parameter selects which
        institution to report on; admins and backend clients can specify any institution, while
        other users can only specify their own and are otherwise rejected with 401 Unauthorized.
        Clients without a top level organization must specify it, and are otherwise rejected
        with 400 Bad Request.
      operationId: getNviReportByYear
      parameters:
        - in: path
          name: year
          description: The year of the nvi period.
          required: true
          schema:
            type: string
            pattern: '^\d{4}$'
        - in: header
          name: Accept
          required: false
          description: >
            Specifies the desired spreadsheet format. Supported formats are
            `application/vnd.openxmlformats-officedocument.spreadsheetml.sheet` (XLSX, default)
            and `application/vnd.ms-excel` (XLS).
          schema:
            type: string
            enum:
              - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
              - application/vnd.ms-excel
            default: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
        - in: query
          name: institutionId
          description: Top level Cristin organization identifier (e.g. 185.90.0.0). Other users than admins and backend clients may only specify their own institution.
          required: false
          schema:
            type: string
            pattern: '^\d+\.\d+\.\d+\.\d+$'
      security: *authenticated
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FetchInstitutionReportHandler.Arn}:live/invocations
        httpMethod: POST
        type: AWS_PROXY
      responses:
        "200":
          description: "OK."
          content:
            application/vnd.ms-excel:
              schema:
                type: string
                format: binary
                description: Base64-encoded Excel (.xls) file.
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
                description: Base64-encoded Excel (.xlsx) file.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /publication/{identifier}/report-status:
    get:
      tags:
        - Report
      summary: Get report status for a publication
      description: >
        Get the NVI report status for a publication, indicating whether the publication
        is reported, under review, or not a candidate.
      operationId: getReportStatusByPublicationId
      parameters:
        - $ref: "#/components/parameters/PublicationIdentifierPathParameter"
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FetchReportStatusByPublicationIdHandler.Arn}:live/invocations
        httpMethod: POST
        type: AWS_PROXY
      responses:
        "200":
          description: "OK."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportStatus"
              example:
                {
                  "publicationId": "https://api.nva.no/publication/123",
                  "reportStatus":
                    {
                      "status": "PENDING_REVIEW",
                      "description": "Pending review. Awaiting approval from all institutions",
                    },
                  "period": "2023",
                }
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /reports:
    get:
      tags:
        - Report
      summary: Get all periods report
      description: >
        Get report for all periods.
        Requires an NVI administrator, curator or editor role, or an internal backend client.
      operationId: getAllPeriodsReport
      security: *authenticated
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FetchReportHandler.Arn}:live/invocations
        httpMethod: POST
        type: AWS_PROXY
      responses:
        "200":
          description: "OK."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllPeriodsReport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /reports/{period}:
    get:
      tags:
        - Report
      summary: Get period report
      description: >
        Get report for a specific period.
        Requires an NVI administrator, curator or editor role, or an internal backend client.
      operationId: getPeriodReport
      parameters:
        - in: path
          name: period
          required: true
          schema:
            type: string
            pattern: '^\d{4}$'
          example: "2025"
      security: *authenticated
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FetchReportHandler.Arn}:live/invocations
        httpMethod: POST
        type: AWS_PROXY
      responses:
        "200":
          description: "OK."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeriodReport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /reports/{period}/institutions:
    get:
      tags:
        - Report
      summary: Get all institutions report for a period
      description: >
        Get all institutions report for a specific period.
        Requires an NVI administrator, curator or editor role, or an internal backend client.
      operationId: getAllInstitutionsReport
      parameters:
        - in: path
          name: period
          required: true
          schema:
            type: string
            pattern: '^\d{4}$'
          example: "2025"
        - in: header
          name: Accept
          required: false
          description: >
            Specifies the desired response format and optional report profile.
            Supported formats are `application/json`, `text/csv`, and `application/vnd.openxmlformats-officedocument.spreadsheetml.sheet` (XLSX).
            For CSV and XLSX, an optional `profile` parameter determines the report type.
            Available profiles are `publication-points` and `author-shares`.
            If no profile is specified, CSV and XLSX responses default to `author-shares`.
            JSON responses do not support profiles.
          schema:
            type: string
            enum:
              - application/json
              - text/csv; charset=utf-8
              - text/csv; charset=utf-8; profile=https://api.nva.unit.no/report/publication-points
              - text/csv; charset=utf-8; profile=https://api.nva.unit.no/report/author-shares
              - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
              - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet; profile=https://api.nva.unit.no/report/publication-points
              - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet; profile=https://api.nva.unit.no/report/author-shares
            default: application/json
      security: *authenticated
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FetchReportHandler.Arn}:live/invocations
        httpMethod: POST
        type: AWS_PROXY
      responses:
        "200":
          description: "OK."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllInstitutionsReport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /reports/{period}/institutions/{institution}:
    get:
      tags:
        - Report (partially implemented)
      summary: Get institution report for a period
      description: >
        Get specific institution report for a specific period.
        Requires an NVI administrator, curator or editor role, or an internal backend client.
      operationId: getInstitutionReport
      parameters:
        - in: path
          name: period
          required: true
          schema:
            type: string
            pattern: '^\d{4}$'
          example: "2025"
        - in: path
          name: institution
          required: true
          schema:
            type: string
            pattern: '^\d+\.\d+\.\d+\.\d+$'
          example: "1.0.0.0"
        - in: query
          name: includeSubunits
          schema:
            type: boolean
            default: false
        - in: header
          name: Accept
          required: false
          schema:
            type: string
            enum:
              - application/json
              - text/csv; charset=utf-8
              - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
            default: application/json
      security: *authenticated
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FetchReportHandler.Arn}:live/invocations
        httpMethod: POST
        type: AWS_PROXY
      responses:
        "200":
          description: "OK."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstitutionReport"
              examples:
                topLevelInstitution:
                  summary: Institution with organization tree (top-level with child and grandchild)
                  value:
                    type: InstitutionReport
                    id: https://api.nva.unit.no/scientific-index/reports/2025/institutions/20754.0.0.0
                    period:
                      type: NviPeriod
                      id: https://api.nva.unit.no/scientific-index/period/2025
                      publishingYear: "2025"
                      startDate: "2025-04-01T00:00:00Z"
                      reportingDate: "2026-04-01T00:00:00Z"
                      status: ClosedPeriod
                    sector: UHI
                    institution: *org-20754-0-0-0
                    institutionSummary:
                      type: InstitutionSummary
                      totals:
                        type: InstitutionTotals
                        validPoints: 12.3456
                        disputedCount: 4
                        globalApprovedCount: 3
                        globalRejectedCount: 1
                        undisputedProcessedCount: 4
                        undisputedTotalCount: 6
                      byLocalApprovalStatus:
                        type: UndisputedCandidatesByLocalApprovalStatus
                        new: 1
                        pending: 1
                        approved: 2
                        rejected: 2
                    units:
                      - type: UnitSummary
                        unit: *org-20754-2-0-0
                        totals:
                          type: UnitTotals
                          validPoints: 8.3456
                          disputedCount: 2
                          undisputedProcessedCount: 1
                          undisputedTotalCount: 2
                        byLocalApprovalStatus:
                          type: UndisputedCandidatesByLocalApprovalStatus
                          new: 1
                          pending: 0
                          approved: 1
                          rejected: 0
                        units:
                          - type: UnitSummary
                            unit: *org-20754-2-1-0
                            totals:
                              type: UnitTotals
                              validPoints: 0.0
                              disputedCount: 0
                              undisputedProcessedCount: 1
                              undisputedTotalCount: 1
                            byLocalApprovalStatus:
                              type: UndisputedCandidatesByLocalApprovalStatus
                              new: 0
                              pending: 0
                              approved: 0
                              rejected: 1
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
                description: Base64-encoded Excel (.xlsx) file.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  parameters:
    PublicationIdentifierPathParameter:
      in: path
      name: identifier
      description: >
        The publication identifier.
        A full UTF-8 encoded publication URI is also accepted, but this format is deprecated.
      required: true
      schema:
        type: string
      examples:
        publicationIdentifier:
          summary: Publication identifier (preferred)
          value: "019facbbf461-5f709279-f824-42bc-a471-61362965632b"
        publicationUri:
          summary: URL-encoded publication URI (deprecated)
          value: "https%3A%2F%2Fapi.dev.nva.aws.unit.no%2Fpublication%2F019facbbf461-5f709279-f824-42bc-a471-61362965632b"
  schemas:
    NviPeriod:
      type: object
      description: An NVI reporting period.
      properties:
        type:
          type: string
          enum: [NviPeriod]
        id:
          type: string
          format: uri
        publishingYear:
          type: string
        reportingDate:
          type: string
          format: date-time
        startDate:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/PeriodStatus"
      required:
        - status
    UpsertNviPeriodRequest:
      type: object
      description: Request body for creating or updating an NVI reporting period.
      properties:
        type:
          type: string
          enum: [NviPeriod]
        id:
          type: string
          format: uri
        publishingYear:
          type: string
        reportingDate:
          type: string
          format: date-time
        startDate:
          type: string
          format: date-time
      required:
        - publishingYear
        - reportingDate
        - startDate
    PeriodStatus:
      type: string
      description: |
        Lifecycle state of the reporting period:
        * `UnopenedPeriod` - the period exists but has not opened for reporting yet
        * `OpenPeriod` - the period is open for reporting
        * `ClosedPeriod` - the reporting deadline has passed
        * `NoPeriod` - no reporting period exists for the publication year
      enum:
        - UnopenedPeriod
        - OpenPeriod
        - ClosedPeriod
        - NoPeriod
    NviPeriods:
      type: array
      items:
        $ref: "#/components/schemas/NviPeriod"
    ReportStatus:
      type: object
      properties:
        publicationId:
          $ref: "#/components/schemas/Id"
        reportStatus:
          type: object
          properties:
            status:
              type: string
              enum:
                - NOT_CANDIDATE
                - REPORTED
                - PENDING_REVIEW
                - UNDER_REVIEW
                - NOT_REPORTED
                - APPROVED
                - REJECTED
                - UNKNOWN
            description:
              type: string
              description: The description of the report status.
        period:
          type: string
          description: The nvi period in which the publication was published.
    CandidateSearchResponse:
      type: object
      properties:
        "@context":
          $ref: "#/components/schemas/Context"
        id:
          $ref: "#/components/schemas/Id"
        totalHits:
          type: integer
        nextResults:
          type: string
          format: uri
          nullable: true
          description: The uri to the next page of results, if there is one.
        previousResults:
          type: string
          format: uri
          nullable: true
          description: The uri to the previous page of results, if there is one.
        hits:
          type: array
          items:
            $ref: "#/components/schemas/CandidateIndexDocument"
    CandidateIndexDocument:
      type: object
      properties:
        identifier:
          type: string
        publicationDetails:
          type: object
          properties:
            id:
              type: string
            type:
              type: string
            title:
              type: string
            publicationDate:
              type: object
              properties:
                year:
                  type: string
                month:
                  type: string
                day:
                  type: string
            contributors:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  affiliations:
                    type: array
                    items:
                      type: string
        approvals:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              labels:
                type: object
                additionalProperties:
                  type: string
              approvalStatus:
                type: string
                enum: [New, Pending, Approved, Rejected]

    NviCandidateResponse:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/Id"
        publicationId:
          $ref: "#/components/schemas/Id"
        approvalStatus:
          type: array
          items:
            $ref: "#/components/schemas/ApprovalStatus"
        points:
          type: array
          items:
            $ref: "#/components/schemas/InstitutionPoints"
        notes:
          type: array
          items:
            $ref: "#/components/schemas/Note"
        period:
          $ref: "#/components/schemas/NviPeriod"
        status:
          type: string
          description: The report status of the candidate.
          example: "Reported"
        reportedDate:
          type: string
          format: date-time
          description: Timestamp for when the candidate was marked as reported.
          example: "2026-01-15T12:00:00Z"
        allowedOperations:
          type: array
          description: >
            List of operations that the user is allowed to perform on the candidate.
            The operations are based on the approval status of the candidate and the user's role.
            This is a work in progress and does not include all possible operations yet.
          items:
            type: string
            enum:
              - "approval/reject-candidate"
              - "approval/approve-candidate"
              - "approval/reset-approval"
              - "note/create-note"
        problems:
          type: array
          description: >
            List of problems that may impact available operations on the Candidate.
            These can indicate something that blocks one or all organizations from approving the
            candidate, or other candidate-specific errors.
            This is a work in progress and does not include all possible problems yet.
          items:
            $ref: "#/components/schemas/CandidateProblem"

    NviInstitutionReportResponse:
      type: object
      description: >
        Status report for a top-level organization for a given year.
        Approvals and points are aggregated by organizational unit based on directly affiliated creators.
      required:
        - year
        - topLevelOrganizationId
        - totals
        - byOrganization
      properties:
        year:
          type: string
          description: The NVI reporting period year.
          example: "2025"
        topLevelOrganizationId:
          type: string
          format: uri
          description: URI of the top-level organization.
          example: "https://api.nva.unit.no/cristin/organization/123.0.0.0"
        totals:
          $ref: "#/components/schemas/TopLevelAggregation"
        byOrganization:
          type: object
          description: Aggregated status for each organization, keyed by organization URI.
          additionalProperties:
            $ref: "#/components/schemas/DirectAffiliationAggregation"
          example:
            "https://api.nva.unit.no/cristin/organization/123.0.0.0":
              type: DirectAffiliationAggregation
              candidateCount: 16
              points: 27.3953
              globalApprovalStatus:
                Dispute: 2
                Pending: 8
                Rejected: 3
                Approved: 3
              approvalStatus:
                New: 4
                Pending: 4
                Approved: 4
                Rejected: 4
            "https://api.nva.unit.no/cristin/organization/123.456.0.0":
              type: DirectAffiliationAggregation
              candidateCount: 4
              points: 1.2345
              globalApprovalStatus:
                Dispute: 0
                Pending: 2
                Rejected: 1
                Approved: 1
              approvalStatus:
                New: 1
                Pending: 1
                Approved: 1
                Rejected: 1

    OrganizationStatusAggregationBase:
      type: object
      description: Base schema for organization status aggregations.
      required:
        - candidateCount
        - points
        - globalApprovalStatus
        - approvalStatus
      properties:
        candidateCount:
          type: integer
          description: Number of NVI candidates.
          minimum: 0
          example: 20
        points:
          type: number
          description: Total NVI points from creators.
          format: double
          example: 31.1234
        globalApprovalStatus:
          $ref: "#/components/schemas/GlobalApprovalStatusCounts"
        approvalStatus:
          $ref: "#/components/schemas/ApprovalStatusCounts"

    TopLevelAggregation:
      description: >
        Aggregation representing totals for a top-level organization.
        Includes transitive points from all sub-organizations.
      allOf:
        - $ref: "#/components/schemas/OrganizationStatusAggregationBase"
        - type: object
          required:
            - type
          properties:
            type:
              type: string
              enum: [TopLevelAggregation]
              example: TopLevelAggregation

    DirectAffiliationAggregation:
      description: >
        Aggregation based on direct creator affiliations to a specific organization.
        Points are calculated only from creators directly affiliated with this organization.
      allOf:
        - $ref: "#/components/schemas/OrganizationStatusAggregationBase"
        - type: object
          required:
            - type
          properties:
            type:
              type: string
              enum: [DirectAffiliationAggregation]
              example: DirectAffiliationAggregation

    GlobalApprovalStatusCounts:
      type: object
      description: Count of candidates by global approval status.
      required:
        - Dispute
        - Pending
        - Rejected
        - Approved
      properties:
        Dispute:
          type: integer
          minimum: 0
        Pending:
          type: integer
          minimum: 0
        Rejected:
          type: integer
          minimum: 0
        Approved:
          type: integer
          minimum: 0
    ApprovalStatusCounts:
      type: object
      description: Count of candidates by approval status.
      required:
        - New
        - Pending
        - Approved
        - Rejected
      properties:
        New:
          type: integer
          minimum: 0
        Pending:
          type: integer
          minimum: 0
        Approved:
          type: integer
          minimum: 0
        Rejected:
          type: integer
          minimum: 0
    ApprovalStatus:
      type: object
      properties:
        institutionId:
          $ref: "#/components/schemas/Id"
        status:
          type: string
          enum: ["Approved", "Pending", "Rejected"]
        finalizedBy:
          type: string
          description: Username of the user who finalized the approval.
        finalizedDate:
          type: string
          format: date-time
    Note:
      type: object
      properties:
        identifier:
          type: string
          format: uuid
        user:
          type: string
          description: Username of the user who created the note.
        text:
          type: string
        createdDate:
          type: string
          format: date-time
    Context:
      type: string
      pattern: "^https://.*$"
      description: The JSON-LD context object for the data, which describes the object in the data and allows machine processing of the data at a semantic level.
    Id:
      type: string
      pattern: "^https://.*$"
      description: The URI of the object ID.
    CandidateProblem:
      type: object
      description: An issue with the candidate that may impact available operations for the user.
      required:
        - title
        - scope
        - detail
      properties:
        type:
          type: string
          description: Identifier for the issue type.
        title:
          type: string
          description: Human-readable title of the issue.
        scope:
          type: string
          description: >
            The scope of the issue, indicating whether it is a general issue ("Global") or only 
            affects the organization of the current user.
          enum: ["Organization", "Global"]
        detail:
          type: string
          description: Additional details about the issue and potential solutions.
        contributors:
          type: array
          items:
            type: string
          description: List of contributors that cause or are affected by the issue, if relevant.
    # Shared. Matches the body that ApiGatewayHandler in nva-commons writes for errors.
    Problem:
      type: object
      description: The error body of every NVA API, a problem details object as in RFC 9457.
      required:
        - title
        - status
        - detail
      properties:
        title:
          type: string
          description: The reason phrase of the HTTP status code, such as Not Found.
        status:
          type: integer
          description: The HTTP status code.
        detail:
          type: string
          description: What went wrong in this request, and how to resolve it when that is known.
        requestId:
          type: string
          description: The identifier of the request. Include it when reporting a problem.
        instance:
          type: string
          description: The path of the request. Only set on errors that API Gateway produces itself.
        resource:
          type: object
          description: The resource the problem concerns, such as the tombstone of a deleted resource. Only set on some 410 responses.
        conflictingKeys:
          type: object
          additionalProperties:
            type: string
          description: The names and values of the identifiers that conflict with existing data. Only set on some 409 responses.
        errors:
          type: array
          description: One entry for each validation rule the request breaks. Only set on some 400 responses.
          items:
            $ref: "#/components/schemas/ValidationError"
      example:
        title: Not Found
        status: 404
        detail: Could not find the requested resource
        requestId: 99b02848-3d7c-4a93-9041-a45bb86c3fe2
    # Shared
    ValidationError:
      type: object
      description: A validation rule that the request breaks.
      required:
        - detail
        - pointer
      properties:
        detail:
          type: string
          description: What is wrong with the field.
        pointer:
          type: string
          description: A JSON pointer (RFC 6901) to the invalid field in the request body, or the name of an invalid query or path parameter.
    InstitutionPoints:
      type: object
      properties:
        institutionId:
          $ref: "#/components/schemas/Id"
        points:
          type: number
          format: double
    ApprovalStatusRequest:
      type: object
      properties:
        institutionId:
          $ref: "#/components/schemas/Id"
        status:
          type: string
          enum: ["Approved", "Pending", "Rejected"]
        reason:
          type: string
          maxLength: 500
          description: Required if status is updated to Rejected. Reason for rejection.
      required:
        - status
    AssigneeRequest:
      type: object
      properties:
        institutionId:
          $ref: "#/components/schemas/Id"
        assignee:
          type: string
      required:
        - institutionId
        - assignee
    CreateNoteRequest:
      type: object
      properties:
        text:
          type: string
    NviCandidateContext:
      type: object
      description: >
        JSON-LD context for NVI candidate resources, mapping the terms used in
        candidate responses to their semantic definitions.
      additionalProperties: true

    AllPeriodsReport:
      type: object
      description: Overview of all NVI reporting periods.
      required:
        - type
        - id
        - periods
      properties:
        type:
          type: string
          enum: [AllPeriodsReport]
        id:
          type: string
          description: Query ID for this report.
          format: uri
          example: https://api.nva.unit.no/scientific-index/reports
        periods:
          type: array
          items:
            $ref: "#/components/schemas/PeriodReport"

    PeriodReport:
      type: object
      description: Report for a specific NVI reporting period, summarizing all candidates in the period.
      required:
        - id
        - type
        - period
        - totals
        - byGlobalApprovalStatus
      properties:
        id:
          type: string
          description: Query ID for this report.
          format: uri
          example: https://api.nva.unit.no/scientific-index/reports/2025
        type:
          type: string
          enum: [PeriodReport]
        period:
          $ref: "#/components/schemas/NviPeriod"
        totals:
          $ref: "#/components/schemas/PeriodTotals"
        byGlobalApprovalStatus:
          $ref: "#/components/schemas/CandidatesByGlobalApprovalStatus"

    AllInstitutionsReport:
      type: object
      description: Report listing all institutions with NVI candidates for a given period.
      required:
        - id
        - type
        - period
        - institutions
      properties:
        id:
          type: string
          description: Query ID for this report.
          format: uri
          example: https://api.nva.unit.no/scientific-index/reports/2025/institutions
        type:
          type: string
          enum: [AllInstitutionsReport]
        period:
          $ref: "#/components/schemas/NviPeriod"
        institutions:
          type: array
          items:
            $ref: "#/components/schemas/InstitutionReport"

    InstitutionReport:
      type: object
      description: >
        Report for a single institution in a given period, summarizing candidates
        affiliated with the institution directly or through its sub-units.
      required:
        - id
        - type
        - period
        - sector
        - institution
        - institutionSummary
      properties:
        id:
          type: string
          description: Query ID for this report.
          format: uri
          example: https://api.nva.unit.no/scientific-index/reports/2025/institutions/20754.0.0.0
        type:
          type: string
          enum: [InstitutionReport]
        period:
          $ref: "#/components/schemas/NviPeriod"
        sector:
          type: string
          description: |
            The sector of the institution:
            * `UHI` - universities and university colleges
            * `HEALTH` - health trusts
            * `INSTITUTE` - research institutes
            * `ABM` - archives, libraries and museums
            * `OTHER` - other institutions
            * `UNKNOWN` - the sector could not be determined
          enum: [UHI, HEALTH, INSTITUTE, ABM, OTHER, UNKNOWN]
        institution:
          $ref: "#/components/schemas/Organization"
        institutionSummary:
          $ref: "#/components/schemas/InstitutionSummary"
        units:
          type: array
          description: Per-unit breakdown. Only included when requesting a specific institution report.
          items:
            $ref: "#/components/schemas/UnitSummary"

    Organization:
      type: object
      description: An organization (institution or unit).
      required:
        - id
        - type
      properties:
        id:
          type: string
          format: uri
        type:
          type: string
          enum: [Organization]
        country:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
        hasPart:
          type: array
          items:
            $ref: "#/components/schemas/Organization"
        partOf:
          type: array
          items:
            $ref: "#/components/schemas/Organization"
      example: *org-20754-0-0-0

    TotalsBase:
      type: object
      description: >
        Base totals for NVI candidates. Points and undisputed counts exclude
        candidates with global approval status Dispute.
      required:
        - validPoints
        - disputedCount
        - undisputedProcessedCount
        - undisputedTotalCount
      properties:
        validPoints:
          type: number
          format: double
          description: Sum of NVI points for undisputed candidates.
        disputedCount:
          type: integer
          minimum: 0
          description: Number of candidates with global approval status Dispute.
        undisputedProcessedCount:
          type: integer
          minimum: 0
          description: Number of undisputed candidates that have been fully processed.
        undisputedTotalCount:
          type: integer
          minimum: 0
          description: Total number of undisputed candidates.
      example:
        validPoints: 12.3456
        disputedCount: 4
        undisputedProcessedCount: 2
        undisputedTotalCount: 6

    PeriodTotals:
      description: Aggregate totals for an NVI period.
      allOf:
        - $ref: "#/components/schemas/TotalsBase"
        - type: object
          required:
            - type
          properties:
            type:
              type: string
              enum: [PeriodTotals]

    InstitutionTotals:
      description: Aggregate totals for an institution.
      allOf:
        - $ref: "#/components/schemas/TotalsBase"
        - type: object
          required:
            - type
            - globalApprovedCount
            - globalRejectedCount
          properties:
            type:
              type: string
              enum: [InstitutionTotals]
            globalApprovedCount:
              type: integer
              minimum: 0
              description: Number of candidates with global approval status Approved.
            globalRejectedCount:
              type: integer
              minimum: 0
              description: Number of candidates with global approval status Rejected.

    UnitTotals:
      description: Aggregate totals for an organizational unit.
      allOf:
        - $ref: "#/components/schemas/TotalsBase"
        - type: object
          required:
            - type
          properties:
            type:
              type: string
              enum: [UnitTotals]

    CandidatesByGlobalApprovalStatus:
      type: object
      description: Count of candidates by global approval status (includes all candidates).
      required:
        - type
        - dispute
        - pending
        - rejected
        - approved
      properties:
        type:
          type: string
          enum: [CandidatesByGlobalApprovalStatus]
        dispute:
          type: integer
          minimum: 0
        pending:
          type: integer
          minimum: 0
        rejected:
          type: integer
          minimum: 0
        approved:
          type: integer
          minimum: 0
      example:
        type: CandidatesByGlobalApprovalStatus
        dispute: 4
        pending: 4
        rejected: 1
        approved: 1

    UndisputedCandidatesByLocalApprovalStatus:
      type: object
      description: >
        Count of undisputed candidates by local approval status.
        Only includes candidates where global approval status is not Dispute.
      required:
        - type
        - new
        - pending
        - approved
        - rejected
      properties:
        type:
          type: string
          enum: [UndisputedCandidatesByLocalApprovalStatus]
        new:
          type: integer
          minimum: 0
        pending:
          type: integer
          minimum: 0
        approved:
          type: integer
          minimum: 0
        rejected:
          type: integer
          minimum: 0
      example:
        type: UndisputedCandidatesByLocalApprovalStatus
        new: 1
        pending: 1
        approved: 2
        rejected: 2

    InstitutionSummary:
      type: object
      description: Summary statistics for an institution's NVI candidates.
      required:
        - type
        - totals
        - byLocalApprovalStatus
      properties:
        type:
          type: string
          enum: [InstitutionSummary]
        totals:
          $ref: "#/components/schemas/InstitutionTotals"
        byLocalApprovalStatus:
          $ref: "#/components/schemas/UndisputedCandidatesByLocalApprovalStatus"

    UnitSummary:
      type: object
      description: >
        Summary for an organizational unit, based on candidates with direct
        creator affiliation to the unit.
      required:
        - type
        - unit
        - totals
        - byLocalApprovalStatus
      properties:
        type:
          type: string
          enum: [UnitSummary]
        unit:
          $ref: "#/components/schemas/Organization"
        totals:
          $ref: "#/components/schemas/UnitTotals"
        byLocalApprovalStatus:
          $ref: "#/components/schemas/UndisputedCandidatesByLocalApprovalStatus"
        units:
          type: array
          description: Nested sub-unit summaries.
          items:
            $ref: "#/components/schemas/UnitSummary"

  # Shared, when used. Keep only the responses the service references, since Spectral warns about
  # unused components. Name any other status after its reason phrase, for example MethodNotAllowed.
  responses:
    BadRequest:
      description: The request is malformed or fails validation.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: The request has no valid access token.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: The caller is not allowed to perform this operation.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: The resource does not exist.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    MethodNotAllowed:
      description: The operation is not allowed on this resource.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotAcceptable:
      description: The service cannot respond with any media type in the Accept header.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: The request conflicts with the current state of the resource.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InternalServerError:
      description: The service failed unexpectedly.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    BadGateway:
      description: A service this API depends on failed or returned an invalid response.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  # Shared. APIs that also serve external clients add `- Ref: ExternalCognitoAuthorizerArn`.
  securitySchemes:
    CognitoUserPool:
      type: apiKey
      name: Authorization
      in: header
      x-amazon-apigateway-authtype: cognito_user_pools
      x-amazon-apigateway-authorizer:
        type: cognito_user_pools
        providerARNs:
          - Ref: CognitoAuthorizerArn
